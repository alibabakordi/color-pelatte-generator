<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>color palette generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="main-screen">
      <h1 class="header">welcome to color palette generator</h1>
      <button class="generate-btn">generate</button>
      <label><input type="radio" name="mode" value="all" checked>all</label>
      <label><input type="radio" name="mode" value="light">light</label>
      <label><input type="radio" name="mode" value="dark">dark</label>
      <div class="palettes"></div>
      
      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
